<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="description" content="{% block description %}{% endblock %}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <title>{% block title %}{% endblock %} · DropLoad</title>
    <link rel="stylesheet" href="{{ 'dropload.css' | versioned }}">
</head>
<body class="dropload-page dl-content-page">
    <svg class="dl-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-arrow-down-to-line" viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></symbol>
        <symbol id="i-play-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4Z"/></symbol>
        <symbol id="i-cloud-upload" viewBox="0 0 24 24"><path d="M12 13v8"/><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="m8 17 4-4 4 4"/></symbol>
        <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    </svg>

    <header class="dl-header">
        <div class="dl-header-inner">
            <a class="dl-brand" href="{{ url_for('index') }}">
                <span class="dl-brand-mark"><svg class="dl-icon" aria-hidden="true"><use href="#i-arrow-down-to-line"></use></svg></span>
                <span class="dl-brand-name">Drop<span>Load</span></span>
            </a>
            <div class="dl-header-actions">
                <a class="dl-header-link" href="{{ url_for('index') }}">
                    <svg class="dl-icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
                    <span>返回下载器</span>
                </a>
            </div>
        </div>
    </header>

    <div class="dl-page">
        <main class="dl-content">
            <nav class="dl-content-nav" aria-label="站点说明">
                {% for endpoint, label in [('about', '项目介绍'), ('terms', '服务条款'), ('privacy', '隐私说明')] %}
                <a class="dl-content-nav-link" href="{{ url_for(endpoint) }}"
                   {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
                {% endfor %}
            </nav>

            <article class="dl-card dl-content-card">
                <header class="dl-content-header">
                    <p class="dl-content-eyebrow">{% block eyebrow %}{% endblock %}</p>
                    <h1 class="dl-content-title">{% block heading %}{% endblock %}</h1>
                    {% block lead %}{% endblock %}
                </header>
                <div class="dl-content-body">
                    {% block content %}{% endblock %}
                </div>
            </article>
        </main>
    </div>

    {% include '_site_footer.html' %}
</body>
</html>
