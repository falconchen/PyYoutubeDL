    <script>
    (function () {
        var Button = videojs.getComponent('Button');
        class AudioDownloadButton extends Button {
            constructor(player, options) {
                super(player, options);
                this.addClass('vjs-download-control');
                this.controlText('下载音频');
            }

            handleClick(event) {
                if (event) {
                    event.preventDefault();
                }
                downloadCurrentAudio();
            }
        }
        videojs.registerComponent('AudioDownloadButton', AudioDownloadButton);

        var audioItems = {{ audio_items | tojson }};
        var fallbackCoverUrl = {{ fallback_cover_url | tojson }};
        var player = videojs('audio-player', {
            playsinline: true,
            playbackRates: [0.5, 0.75, 1, 1.5, 2, 3],
            audioPosterMode: true,
            controlBar: {
                pictureInPictureToggle: false,
                fullscreenToggle: false
            },
            poster: fallbackCoverUrl
        });
        var currentIndex = 0;
        var currentFilename = {{ (audio_items[0].filename if audio_items else '') | tojson }};
        var aiSummaryConfigured = {{ ai_summary_configured | tojson }};
        var aiSummaryResults = {};
        var playbackProgressPrefix = 'pyyoutubedl:audio-playback-progress:';
        var playbackEndThreshold = 3;
        var lastProgressSaveAt = 0;
        var posterRequestSerial = 0;
        var coverGradient = document.getElementById('audio-cover-gradient');
        var visualizerCanvas = document.getElementById('audio-visualizer');
        var visualizerContext = visualizerCanvas.getContext('2d');
        var visualizerAudioContext = null;
        var visualizerSourceNode = null;
        var visualizerAnalyser = null;
        var visualizerFrequencyData = null;
        var visualizerAnimationFrame = null;
        var visualizerResizeObserver = null;
        var visualizerUnavailable = false;
        var visualizerPixelRatio = 1;
        var reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        var lyricsPanel = document.querySelector('.lyrics-panel');
        var lyricsContent = document.getElementById('lyrics-content');
        var lyricsLanguage = document.getElementById('lyrics-language');
        var currentLyrics = [];
        var currentLyricIndex = -1;
        var lyricsRequestSerial = 0;

        BackgroundPlayback.attach(player, function () {
            return findAudioItem(currentFilename) || { title: currentFilename };
        });

        player.ready(function () {
            var controlBar = player.getChild('controlBar');
            controlBar.addChild('AudioDownloadButton', {}, controlBar.children().length);
            player.el().appendChild(coverGradient);
            player.el().appendChild(visualizerCanvas);
            player.el().appendChild(lyricsPanel);
            setupAudioVisualizer();
            if (audioItems.length > 0) {
                updatePoster(audioItems[0]);
                loadLyrics(audioItems[0]);
            } else {
                hideLyricsPanel();
            }
            updateAiSummaryPanel(currentFilename);
            if (player.readyState() >= 1) {
                restoreCurrentAudioProgress();
            }
        });

        function setupAudioVisualizer() {
            resizeVisualizerCanvas();
            if (window.ResizeObserver) {
                visualizerResizeObserver = new ResizeObserver(resizeVisualizerCanvas);
                visualizerResizeObserver.observe(player.el());
            } else {
                window.addEventListener('resize', resizeVisualizerCanvas);
            }

            var primeVisualizer = function () {
                initializeAudioVisualizer();
            };
            player.el().addEventListener('pointerdown', primeVisualizer, { passive: true });
            player.el().addEventListener('keydown', primeVisualizer);

            if (reducedMotionQuery.addEventListener) {
                reducedMotionQuery.addEventListener('change', handleReducedMotionChange);
            } else {
                reducedMotionQuery.addListener(handleReducedMotionChange);
            }
        }

        function getPlayerMediaElement() {
            var tech = player.tech(true);
            if (tech && typeof tech.el === 'function') {
                return tech.el();
            }
            return player.el().querySelector('audio, video');
        }

        function initializeAudioVisualizer() {
            if (
                visualizerUnavailable
                || BackgroundPlayback.isIOS
                || reducedMotionQuery.matches
                || !visualizerContext
            ) {
                return Promise.resolve(false);
            }

            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                visualizerUnavailable = true;
                return Promise.resolve(false);
            }

            try {
                if (!visualizerAudioContext) {
                    visualizerAudioContext = new AudioContextClass();
                    visualizerAnalyser = visualizerAudioContext.createAnalyser();
                    visualizerAnalyser.fftSize = 256;
                    visualizerAnalyser.smoothingTimeConstant = 0.82;
                    visualizerFrequencyData = new Uint8Array(
                        visualizerAnalyser.frequencyBinCount
                    );

                    var mediaElement = getPlayerMediaElement();
                    if (!mediaElement) {
                        throw new Error('找不到音频媒体元素');
                    }
                    visualizerSourceNode = visualizerAudioContext.createMediaElementSource(
                        mediaElement
                    );
                    visualizerSourceNode.connect(visualizerAnalyser);
                    visualizerAnalyser.connect(visualizerAudioContext.destination);
                }
            } catch (error) {
                visualizerUnavailable = true;
                console.warn('无法初始化音频频谱，已保留普通播放器', error);
                return Promise.resolve(false);
            }

            if (visualizerAudioContext.state === 'suspended') {
                return visualizerAudioContext.resume().then(function () {
                    return true;
                }).catch(function () {
                    return false;
                });
            }
            return Promise.resolve(true);
        }

        function startAudioVisualizer() {
            if (
                reducedMotionQuery.matches
                || document.hidden
                || player.paused()
            ) {
                return;
            }

            initializeAudioVisualizer().then(function (ready) {
                if (
                    ready
                    && !reducedMotionQuery.matches
                    && !document.hidden
                    && !player.paused()
                    && visualizerAnimationFrame === null
                ) {
                    drawAudioVisualizer();
                }
            });
        }

        function stopAudioVisualizer() {
            if (visualizerAnimationFrame !== null) {
                window.cancelAnimationFrame(visualizerAnimationFrame);
                visualizerAnimationFrame = null;
            }
        }

        function resetAudioVisualizer() {
            stopAudioVisualizer();
            clearAudioVisualizer();
        }

        function clearAudioVisualizer() {
            if (!visualizerContext) {
                return;
            }
            var width = visualizerCanvas.width / visualizerPixelRatio;
            var height = visualizerCanvas.height / visualizerPixelRatio;
            visualizerContext.clearRect(0, 0, width, height);
        }

        function resizeVisualizerCanvas() {
            if (!visualizerContext) {
                return;
            }
            var bounds = player.el().getBoundingClientRect();
            if (!bounds.width || !bounds.height) {
                return;
            }

            visualizerPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            visualizerCanvas.width = Math.round(bounds.width * visualizerPixelRatio);
            visualizerCanvas.height = Math.round(bounds.height * visualizerPixelRatio);
            visualizerContext.setTransform(
                visualizerPixelRatio,
                0,
                0,
                visualizerPixelRatio,
                0,
                0
            );
        }

        function drawRoundedBar(context, x, y, width, height, radius) {
            var safeRadius = Math.min(radius, width / 2, height / 2);
            context.beginPath();
            context.moveTo(x + safeRadius, y);
            context.lineTo(x + width - safeRadius, y);
            context.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
            context.lineTo(x + width, y + height);
            context.lineTo(x, y + height);
            context.lineTo(x, y + safeRadius);
            context.quadraticCurveTo(x, y, x + safeRadius, y);
            context.closePath();
            context.fill();
        }

        function drawAudioVisualizer() {
            if (
                !visualizerAnalyser
                || reducedMotionQuery.matches
                || document.hidden
                || player.paused()
            ) {
                stopAudioVisualizer();
                return;
            }

            var width = visualizerCanvas.width / visualizerPixelRatio;
            var height = visualizerCanvas.height / visualizerPixelRatio;
            visualizerContext.clearRect(0, 0, width, height);
            visualizerAnalyser.getByteFrequencyData(visualizerFrequencyData);

            var horizontalPadding = Math.max(14, width * 0.035);
            // 将柱形基线固定在播放进度条上方的窄安全区内，避免底部留下大块空白。
            var controlBarClearance = Math.max(46, Math.min(54, height * 0.1));
            var baseline = height - controlBarClearance;
            var maximumBarHeight = height * 0.3;
            var barCount = Math.max(24, Math.min(64, Math.floor(width / 14)));
            var barGap = width < 480 ? 2 : 3;
            var availableWidth = width - horizontalPadding * 2;
            var barWidth = Math.max(2, (availableWidth - barGap * (barCount - 1)) / barCount);
            var usedFrequencyBins = Math.floor(visualizerFrequencyData.length * 0.72);

            var barGradient = visualizerContext.createLinearGradient(0, baseline - maximumBarHeight, 0, baseline);
            barGradient.addColorStop(0, 'rgba(255, 196, 92, 0.92)');
            barGradient.addColorStop(0.48, 'rgba(255, 78, 47, 0.9)');
            barGradient.addColorStop(1, 'rgba(220, 20, 60, 0.82)');
            visualizerContext.fillStyle = barGradient;
            visualizerContext.shadowColor = 'rgba(255, 48, 48, 0.32)';
            visualizerContext.shadowBlur = 8;

            for (var barIndex = 0; barIndex < barCount; barIndex++) {
                var startRatio = barIndex / barCount;
                var endRatio = (barIndex + 1) / barCount;
                var startBin = Math.floor(Math.pow(startRatio, 1.7) * usedFrequencyBins);
                var endBin = Math.max(
                    startBin + 1,
                    Math.floor(Math.pow(endRatio, 1.7) * usedFrequencyBins)
                );
                var total = 0;
                for (var binIndex = startBin; binIndex < endBin; binIndex++) {
                    total += visualizerFrequencyData[binIndex];
                }
                var average = total / (endBin - startBin);
                var normalized = average / 255;
                var barHeight = Math.max(2, Math.pow(normalized, 1.25) * maximumBarHeight);
                var x = horizontalPadding + barIndex * (barWidth + barGap);
                drawRoundedBar(
                    visualizerContext,
                    x,
                    baseline - barHeight,
                    barWidth,
                    barHeight,
                    Math.min(3, barWidth / 2)
                );
            }

            visualizerContext.shadowBlur = 0;
            visualizerAnimationFrame = window.requestAnimationFrame(drawAudioVisualizer);
        }

        function handleReducedMotionChange(event) {
            if (event.matches) {
                stopAudioVisualizer();
            } else if (!player.paused() && !document.hidden) {
                startAudioVisualizer();
            }
        }

        function findAudioItem(filename) {
            return audioItems.find(function (item) {
                return item.filename === filename;
            });
        }

        function updatePoster(audioItem) {
            var requestSerial = ++posterRequestSerial;
            var candidates = (audioItem && audioItem.cover_candidates || []).slice();
            player.poster(fallbackCoverUrl);

            function tryCandidate(index) {
                if (requestSerial !== posterRequestSerial || index >= candidates.length) {
                    return;
                }
                var image = new Image();
                image.referrerPolicy = 'no-referrer';
                image.onload = function () {
                    if (requestSerial === posterRequestSerial) {
                        player.poster(candidates[index]);
                    }
                };
                image.onerror = function () {
                    tryCandidate(index + 1);
                };
                image.src = candidates[index];
            }

            tryCandidate(0);
        }

        function downloadCurrentAudio() {
            var src = player.currentSrc();
            if (!src || !currentFilename) {
                return;
            }

            var link = document.createElement('a');
            link.href = src;
            link.download = currentFilename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function updatePlayerUrl(filename) {
            var url = new URL(window.location.href);
            url.pathname = {{ url_for('player') | tojson }};
            url.searchParams.set('tab', 'audio');
            url.searchParams.set('file', filename);
            window.history.replaceState({ filename: filename }, '', url);
        }

        function playbackProgressKey(filename) {
            return playbackProgressPrefix + filename;
        }

        function clearAudioProgress(filename) {
            if (!filename) {
                return;
            }
            try {
                localStorage.removeItem(playbackProgressKey(filename));
            } catch (error) {
                console.warn('无法清除音频播放进度', error);
            }
        }

        function saveCurrentAudioProgress() {
            if (!currentFilename) {
                return;
            }
            var currentTime = player.currentTime();
            var duration = player.duration();
            if (!Number.isFinite(currentTime) || currentTime <= 0) {
                return;
            }
            try {
                if (
                    Number.isFinite(duration)
                    && duration > 0
                    && duration - currentTime <= playbackEndThreshold
                ) {
                    localStorage.removeItem(playbackProgressKey(currentFilename));
                    return;
                }
                localStorage.setItem(
                    playbackProgressKey(currentFilename),
                    String(currentTime)
                );
            } catch (error) {
                console.warn('无法保存音频播放进度', error);
            }
        }

        function restoreCurrentAudioProgress() {
            if (!currentFilename) {
                return;
            }
            try {
                var savedTime = Number(
                    localStorage.getItem(playbackProgressKey(currentFilename))
                );
                var duration = player.duration();
                if (!Number.isFinite(savedTime) || savedTime <= 0) {
                    return;
                }
                if (
                    Number.isFinite(duration)
                    && duration > 0
                    && savedTime < duration - playbackEndThreshold
                ) {
                    player.currentTime(savedTime);
                } else {
                    clearAudioProgress(currentFilename);
                }
            } catch (error) {
                console.warn('无法恢复音频播放进度', error);
            }
        }

        function getAudioSummaryTrack(filename) {
            var audioItem = findAudioItem(filename);
            if (!audioItem || !audioItem.summary_tracks || !audioItem.summary_tracks.length) return null;
            if (audioItem.lyrics) {
                var selected = audioItem.summary_tracks.find(function (track) {
                    return track.subtitle_filename === audioItem.lyrics.filename;
                });
                if (selected) return selected;
            }
            return audioItem.summary_tracks[0];
        }

        function audioSummaryCacheKey(filename, track) {
            return filename + ':' + (track ? track.id : 'none');
        }

        function resetAiSummaryContent() {
            var content = document.getElementById('audio-ai-summary-content');
            var copyButton = document.getElementById('audio-copy-ai-summary');
            var toggleButton = document.getElementById('audio-toggle-ai-summary');
            content.replaceChildren();
            content.hidden = true;
            content.classList.remove('is-collapsed');
            copyButton.hidden = true;
            toggleButton.hidden = true;
            toggleButton.textContent = '展开';
            toggleButton.setAttribute('aria-expanded', 'false');
        }

        function renderAiSummary(markdown, streaming) {
            var content = document.getElementById('audio-ai-summary-content');
            var copyButton = document.getElementById('audio-copy-ai-summary');
            var toggleButton = document.getElementById('audio-toggle-ai-summary');
            try {
                if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') throw new Error('Markdown 渲染组件未加载');
                content.innerHTML = DOMPurify.sanitize(marked.parse(markdown, { gfm: true, breaks: true }), {
                    FORBID_TAGS: ['img', 'svg', 'math', 'style'],
                    FORBID_ATTR: ['style']
                });
            } catch (error) {
                console.warn('Markdown 渲染失败，已回退为纯文本', error);
                content.textContent = markdown;
            }
            content.hidden = false;
            content.classList.remove('is-collapsed');
            copyButton.hidden = Boolean(streaming);
            toggleButton.hidden = Boolean(streaming);
            toggleButton.textContent = '收起';
            toggleButton.setAttribute('aria-expanded', 'true');
        }

        async function consumeAiSummaryStream(jobId, onMessage) {
            var response = await fetch('/api/ai_summary/jobs/' + encodeURIComponent(jobId) + '/stream', {
                headers: { 'Accept': 'application/x-ndjson' }
            });
            if (!response.ok || !response.body) throw new Error('无法连接总结流');
            var reader = response.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';
            var terminal = false;
            while (true) {
                var chunk = await reader.read();
                buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
                var lines = buffer.split('\n');
                buffer = lines.pop();
                for (var index = 0; index < lines.length; index += 1) {
                    if (!lines[index].trim()) continue;
                    var message = JSON.parse(lines[index]);
                    if (message.type !== 'keepalive') {
                        onMessage(message);
                        terminal = message.status === 'completed' || message.status === 'failed';
                    }
                }
                if (chunk.done) break;
            }
            if (buffer.trim()) {
                var finalMessage = JSON.parse(buffer);
                onMessage(finalMessage);
                terminal = finalMessage.status === 'completed' || finalMessage.status === 'failed';
            }
            if (!terminal) throw new Error('AI 总结流提前结束');
        }

        function updateAiSummaryPanel(filename) {
            var button = document.getElementById('audio-generate-ai-summary');
            var status = document.getElementById('audio-ai-summary-status');
            var track = getAudioSummaryTrack(filename);
            var cached = track ? aiSummaryResults[audioSummaryCacheKey(filename, track)] : null;
            if (cached) renderAiSummary(cached); else resetAiSummaryContent();
            if (!aiSummaryConfigured) {
                button.disabled = true;
                status.textContent = 'AI 总结尚未配置。';
            } else if (!track) {
                button.disabled = true;
                status.textContent = filename ? '当前音频没有可用字幕或歌词。' : '暂无音频。';
            } else {
                button.disabled = false;
                button.textContent = cached ? '重新显示' : '生成总结';
                status.textContent = cached ? '已使用' + track.label + '生成总结。' : '将读取' + track.label + '并按需生成总结。';
            }
        }

        async function generateAiSummary() {
            var requestedFilename = currentFilename;
            var track = getAudioSummaryTrack(requestedFilename);
            if (!aiSummaryConfigured || !requestedFilename || !track) return updateAiSummaryPanel(requestedFilename);
            var button = document.getElementById('audio-generate-ai-summary');
            var status = document.getElementById('audio-ai-summary-status');
            var cacheKey = audioSummaryCacheKey(requestedFilename, track);
            if (aiSummaryResults[cacheKey]) return renderAiSummary(aiSummaryResults[cacheKey]);
            button.disabled = true;
            button.textContent = '生成中…';
            status.textContent = '正在读取字幕或歌词并生成总结，请稍候…';
            try {
                var response = await fetch({{ url_for('api_ai_summary') | tojson }}, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: requestedFilename,
                        subtitle_source: track.source_kind,
                        subtitle_filename: track.subtitle_filename,
                        stream_index: track.stream_index
                    })
                });
                var result = await response.json();
                if (response.status === 202 && result.success && result.job_id) {
                    await consumeAiSummaryStream(result.job_id, function (streamResult) {
                        result = streamResult;
                        if (streamResult.partial_markdown && currentFilename === requestedFilename) renderAiSummary(streamResult.partial_markdown, true);
                        status.textContent = streamResult.status === 'generating' ? 'AI 正在流式生成总结…' : '正在准备字幕或歌词…';
                    });
                }
                if (!response.ok || !result.success) throw new Error(result.message || (result.error && result.error.message) || '生成总结失败');
                aiSummaryResults[cacheKey] = result.summary;
                if (currentFilename === requestedFilename) {
                    renderAiSummary(result.summary);
                    status.textContent = '已使用' + result.subtitle + '生成总结。';
                }
            } catch (error) {
                if (currentFilename === requestedFilename) status.textContent = error.message || '生成总结失败，请稍后重试。';
            } finally {
                if (currentFilename === requestedFilename) {
                    button.disabled = false;
                    button.textContent = aiSummaryResults[cacheKey] ? '重新显示' : '生成总结';
                }
            }
        }

        function fallbackCopyText(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            var copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('浏览器拒绝复制');
        }

        async function copyAiSummary() {
            var track = getAudioSummaryTrack(currentFilename);
            var summary = track ? aiSummaryResults[audioSummaryCacheKey(currentFilename, track)] : null;
            if (!summary) return;
            try {
                if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(summary);
                else fallbackCopyText(summary);
                document.getElementById('audio-ai-summary-status').textContent = 'AI 总结已复制。';
            } catch (error) {
                document.getElementById('audio-ai-summary-status').textContent = '复制失败，请手动选择总结内容。';
            }
        }

        function toggleAiSummary() {
            var content = document.getElementById('audio-ai-summary-content');
            var button = document.getElementById('audio-toggle-ai-summary');
            var expanded = content.classList.contains('is-collapsed');
            content.classList.toggle('is-collapsed', !expanded);
            button.textContent = expanded ? '收起' : '展开';
            button.setAttribute('aria-expanded', String(expanded));
        }

        document.getElementById('audio-generate-ai-summary').addEventListener('click', generateAiSummary);
        document.getElementById('audio-copy-ai-summary').addEventListener('click', copyAiSummary);
        document.getElementById('audio-toggle-ai-summary').addEventListener('click', toggleAiSummary);

        function updateCurrentAudioInfo(audioItem) {
            document.getElementById('current-audio-title').textContent = audioItem.title;
            var source = document.getElementById('current-audio-source');
            var sourceLink = source.querySelector('a');
            var sourceUrl = audioItem.source_url || '';
            sourceLink.href = sourceUrl;
            source.hidden = !sourceUrl;
            updateMediaMetadata('current-audio-metadata', audioItem);
        }

        function updateMediaMetadata(containerId, metadata) {
            var container = document.getElementById(containerId);
            var hasMetadata = false;
            container.querySelectorAll('[data-meta-field]').forEach(function (row) {
                var value = metadata[row.dataset.metaField] || '';
                row.querySelector('dd').textContent = value;
                row.hidden = !value;
                hasMetadata = hasMetadata || Boolean(value);
            });
            var description = container.querySelector('[data-meta-description]');
            var descriptionText = metadata.description || '';
            description.querySelector('p').textContent = descriptionText;
            description.hidden = !descriptionText;
            if (!descriptionText) {
                description.open = false;
            }
            container.hidden = !hasMetadata && !descriptionText;
        }

        function showLyricsStatus(message) {
            currentLyrics = [];
            currentLyricIndex = -1;
            lyricsPanel.hidden = false;
            lyricsContent.replaceChildren();
            var status = document.createElement('p');
            status.className = 'lyrics-status';
            status.textContent = message;
            lyricsContent.appendChild(status);
            lyricsLanguage.hidden = true;
            lyricsLanguage.textContent = '';
        }

        function hideLyricsPanel() {
            currentLyrics = [];
            currentLyricIndex = -1;
            lyricsContent.replaceChildren();
            lyricsLanguage.hidden = true;
            lyricsLanguage.textContent = '';
            lyricsPanel.hidden = true;
        }

        function parseLyricTimestamp(value) {
            var normalized = value.trim().replace(',', '.');
            var parts = normalized.split(':').map(Number);
            if (parts.some(function (part) { return !Number.isFinite(part); })) {
                return null;
            }
            if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }
            return null;
        }

        function parseLrcLyrics(text) {
            var cues = [];
            text.replace(/^\uFEFF/, '').split(/\r?\n/).forEach(function (line) {
                var timestamps = [];
                var timestampPattern = /\[(\d{1,3}:\d{2}(?:\.\d{1,3})?)\]/g;
                var match;
                while ((match = timestampPattern.exec(line)) !== null) {
                    var time = parseLyricTimestamp(match[1]);
                    if (time !== null) {
                        timestamps.push(time);
                    }
                }
                var lyric = line.replace(timestampPattern, '').trim();
                if (!lyric || timestamps.length === 0) {
                    return;
                }
                timestamps.forEach(function (time) {
                    cues.push({ time: time, text: lyric });
                });
            });
            return cues;
        }

        function stripLyricMarkup(text) {
            var parsed = new DOMParser().parseFromString(text, 'text/html');
            return (parsed.body.textContent || '').trim();
        }

        function parseTimedTextLyrics(text) {
            var cues = [];
            var lines = text.replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n');
            for (var index = 0; index < lines.length; index++) {
                if (lines[index].indexOf('-->') === -1) {
                    continue;
                }
                var start = parseLyricTimestamp(lines[index].split('-->')[0]);
                if (start === null) {
                    continue;
                }
                var lyricLines = [];
                for (index += 1; index < lines.length && lines[index].trim(); index++) {
                    lyricLines.push(lines[index].trim());
                }
                var lyric = stripLyricMarkup(lyricLines.join(' '));
                if (lyric) {
                    cues.push({ time: start, text: lyric });
                }
            }
            return cues;
        }

        function parseLyrics(text, format) {
            var cues = format === 'lrc'
                ? parseLrcLyrics(text)
                : parseTimedTextLyrics(text);
            cues.sort(function (left, right) { return left.time - right.time; });
            return cues;
        }

        function renderLyrics(cues, lyrics) {
            lyricsContent.replaceChildren();
            currentLyrics = cues;
            currentLyricIndex = -1;
            lyricsPanel.hidden = false;
            cues.forEach(function (cue, index) {
                var line = document.createElement('button');
                line.type = 'button';
                line.className = 'lyrics-line';
                line.textContent = cue.text;
                line.dataset.lyricIndex = String(index);
                line.addEventListener('click', function () {
                    player.currentTime(cue.time);
                    player.play();
                });
                lyricsContent.appendChild(line);
            });
            lyricsLanguage.textContent = lyrics.language || lyrics.format.toUpperCase();
            lyricsLanguage.hidden = false;
            syncLyrics();
        }

        function loadLyrics(audioItem) {
            var requestSerial = ++lyricsRequestSerial;
            if (!audioItem || !audioItem.lyrics) {
                hideLyricsPanel();
                return;
            }
            showLyricsStatus('正在加载歌词…');
            fetch(audioItem.lyrics.url, { credentials: 'same-origin' })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.text();
                })
                .then(function (text) {
                    if (requestSerial !== lyricsRequestSerial) {
                        return;
                    }
                    var cues = parseLyrics(text, audioItem.lyrics.format);
                    if (cues.length === 0) {
                        hideLyricsPanel();
                        return;
                    }
                    renderLyrics(cues, audioItem.lyrics);
                })
                .catch(function (error) {
                    if (requestSerial === lyricsRequestSerial) {
                        console.warn('加载歌词失败', error);
                        hideLyricsPanel();
                    }
                });
        }

        function syncLyrics() {
            if (currentLyrics.length === 0) {
                return;
            }
            var currentTime = player.currentTime();
            var nextIndex = -1;
            for (var index = currentLyrics.length - 1; index >= 0; index--) {
                if (currentLyrics[index].time <= currentTime + 0.05) {
                    nextIndex = index;
                    break;
                }
            }
            if (nextIndex === currentLyricIndex) {
                return;
            }
            var previousLine = lyricsContent.querySelector('.lyrics-line.active');
            if (previousLine) {
                previousLine.classList.remove('active');
                previousLine.removeAttribute('aria-current');
            }
            currentLyricIndex = nextIndex;
            if (nextIndex < 0) {
                return;
            }
            var activeLine = lyricsContent.querySelector(
                '[data-lyric-index="' + nextIndex + '"]'
            );
            if (activeLine) {
                activeLine.classList.add('active');
                activeLine.setAttribute('aria-current', 'true');
                // Only scroll the lyrics viewport; scrollIntoView also moves the page.
                var contentRect = lyricsContent.getBoundingClientRect();
                var lineRect = activeLine.getBoundingClientRect();
                lyricsContent.scrollTo({
                    top: lyricsContent.scrollTop + lineRect.top - contentRect.top
                        - lyricsContent.clientTop
                        - (lyricsContent.clientHeight - lineRect.height) / 2,
                    behavior: reducedMotionQuery.matches ? 'auto' : 'smooth'
                });
            }
        }

        function updateActiveItem(filename) {
            document.querySelectorAll('#audio-list .playlist-item').forEach(function (item) {
                var isActive = item.dataset.filename === filename;
                item.classList.toggle('active', isActive);
                if (isActive) {
                    item.setAttribute('aria-current', 'true');
                } else {
                    item.removeAttribute('aria-current');
                }
            });
        }

        function switchAudio(element, savePrevious) {
            var filename = element.dataset.filename;
            var audioItem = findAudioItem(filename);
            if (!audioItem) {
                return;
            }
            if (savePrevious !== false) {
                saveCurrentAudioProgress();
            }

            resetAudioVisualizer();
            currentFilename = filename;
            currentIndex = audioItems.indexOf(audioItem);
            player.src({ type: audioItem.mime_type, src: audioItem.url });
            updatePoster(audioItem);
            loadLyrics(audioItem);
            updateCurrentAudioInfo(audioItem);
            updateAiSummaryPanel(filename);
            updateActiveItem(filename);
            updatePlayerUrl(filename);
            player.play();
        }

        player.on('ended', function () {
            stopAudioVisualizer();
            clearAudioProgress(currentFilename);
            var nextIndex = currentIndex + 1;
            if (nextIndex < audioItems.length) {
                var playlistItems = document.querySelectorAll('#audio-list .playlist-item');
                var nextElement = playlistItems[nextIndex];
                if (nextElement) {
                    switchAudio(nextElement, false);
                }
            }
        });

        player.on('loadedmetadata', restoreCurrentAudioProgress);
        player.on('play', startAudioVisualizer);
        player.on('pause', stopAudioVisualizer);
        player.on('timeupdate', function () {
            syncLyrics();
            var now = Date.now();
            if (now - lastProgressSaveAt >= 2000) {
                lastProgressSaveAt = now;
                saveCurrentAudioProgress();
            }
        });
        player.on('pause', saveCurrentAudioProgress);
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopAudioVisualizer();
            } else if (!player.paused()) {
                startAudioVisualizer();
            }
        });
        window.addEventListener('beforeunload', saveCurrentAudioProgress);

        player.on('play', function () {
            var activeItem = document.querySelector('#audio-list .playlist-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });
            window.switchAudio = switchAudio;
    })();
    </script>
