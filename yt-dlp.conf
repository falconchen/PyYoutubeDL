-f "bestvideo[filesize<500M][height<=1080][vcodec!~='vp0?9'][vcodec!~='av0?1']+bestaudio/bestvideo[height<=480][vcodec!~='vp0?9'][vcodec!~='av0?1']+bestaudio/hls-1080p"
--no-mtime
--progress
--embed-subs
#--embed-thumbnail
--merge-output-format mp4
--write-sub
--write-auto-sub
--sub-lang zh-Hans
--sub-lang zh-Hant
--sub-lang en
--convert-subs "srt"
--ignore-errors
# 原为 -t sleep（= --sleep-interval 10 --max-sleep-interval 20
# --sleep-subtitles 5 --sleep-requests 0.75），每条流睡 10~20 秒，
# 单个视频要下视频+音频两条流，等待过长。改为 5 秒以内：
--sleep-requests 0.75
--sleep-interval 1
--max-sleep-interval 5
--sleep-subtitles 0
--no-check-certificate

#--js-runtimes "deno:/Users/falcon/.deno/bin/deno"
# 注意：不能用 127.0.0.1 —— --proxy 对所有请求生效，socks5h 会把该地址
# 交给 mihomo 解析，指向的是容器自身回环。必须用本机 LAN IP，由 mihomo
# 的 GEOIP,LAN,DIRECT 规则回连宿主机。（yt-dlp 不理会 no_proxy 环境变量）
--extractor-args "bgutil-ytdlp-pot-provider:provider_endpoint=http://192.168.6.7:4416"
#--remote-components ejs:github
#--sleep-requests 1 --min-sleep-interval 1 --max-sleep-interval 5

# ---- 以下原由 /etc/yt-dlp.conf 提供；downloader.py 现用 --ignore-config
# ---- 屏蔽系统配置，故在此显式声明，避免行为随系统配置漂移。
--retries 10
--socket-timeout 20
--retry-sleep linear=1::5
