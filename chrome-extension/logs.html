<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yter 实时日志</title>
  <link rel="stylesheet" href="logs.css">
</head>
<body>
  <main class="log-page">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon48.png" width="40" height="40" alt="">
        <div>
          <h1>downloader.log</h1>
          <p id="server-label">正在读取服务器设置…</p>
        </div>
      </div>
      <div class="toolbar" aria-label="日志控制">
        <button id="pause-button" type="button">
          <span aria-hidden="true">Ⅱ</span>
          暂停
        </button>
        <button id="clear-button" type="button">
          <span aria-hidden="true">⌫</span>
          清空显示
        </button>
        <button id="reconnect-button" type="button">
          <span aria-hidden="true">↻</span>
          重新连接
        </button>
      </div>
    </header>

    <section class="terminal-card" aria-label="实时下载日志">
      <div class="terminal-chrome" aria-hidden="true">
        <span class="window-dot red"></span>
        <span class="window-dot yellow"></span>
        <span class="window-dot green"></span>
        <span class="terminal-title">tail -f downloader.log</span>
      </div>
      <div id="log-output" class="log-output" role="log" aria-live="off" tabindex="0">
        <p id="empty-message" class="empty-message">等待日志数据…</p>
      </div>
    </section>

    <footer class="statusbar">
      <div class="connection-state">
        <span id="connection-dot" class="connection-dot connecting" aria-hidden="true"></span>
        <span id="connection-status" role="status" aria-live="polite">正在连接</span>
      </div>
      <button id="autoscroll-button" class="autoscroll active" type="button" aria-pressed="true">
        自动滚动：开
      </button>
    </footer>
  </main>
  <script src="logs.js"></script>
</body>
</html>
