<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配置 yter 下载</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <img class="app-icon" src="icons/icon48.png" width="44" height="44" alt="">
      <div class="app-copy">
        <h1>yter 下载</h1>
        <p>右键下载，完成后自动通知</p>
      </div>
      <span class="status-badge" aria-label="扩展已启用">
        <span class="status-dot" aria-hidden="true"></span>
        已启用
      </span>
    </header>

    <section class="settings-card" aria-labelledby="settings-title">
      <div class="section-heading">
        <div>
          <h2 id="settings-title">服务设置</h2>
          <p>下载任务将发送到这个 yter 实例</p>
        </div>
        <span class="polling-label">30 秒轮询</span>
      </div>

      <form id="settings-form">
        <label for="server-url">yter 服务地址</label>
        <div class="url-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M10.5 13.5a4.95 4.95 0 0 0 7 0l2-2a4.95 4.95 0 0 0-7-7l-1.15 1.15M13.5 10.5a4.95 4.95 0 0 0-7 0l-2 2a4.95 4.95 0 0 0 7 7l1.15-1.15"/>
          </svg>
          <input
            id="server-url"
            name="server-url"
            type="url"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="https://yter.cellmean.com"
            required
          >
        </div>
        <p class="help">自定义地址保存时，Chrome 会请求该站点的访问权限。</p>
        <label class="secondary-label" for="log-token">日志访问令牌</label>
        <div class="url-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10Zm6 4v2"/>
          </svg>
          <input
            id="log-token"
            name="log-token"
            type="password"
            autocomplete="off"
            placeholder="服务器日志令牌"
          >
        </div>
        <p class="help">令牌仅保存在本机，用于访问实时日志。</p>
        <label class="secondary-label" for="ai-summary-token">AI总结访问令牌</label>
        <div class="url-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10Zm6 4v2"/>
          </svg>
          <input
            id="ai-summary-token"
            name="ai-summary-token"
            type="password"
            autocomplete="off"
            placeholder="服务器 AI 总结令牌"
          >
        </div>
        <p class="help">令牌仅保存在本机，不会传入当前网页。</p>
        <button class="save-button" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M5 4h12l2 2v14H5V4Zm3 0v6h8V4M8 20v-6h8v6"/>
          </svg>
          保存设置
        </button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="popup-footer">
      <div class="footer-actions">
        <a class="options-link" href="logs.html" target="_blank">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
            <path d="m5 7 4 4-4 4m6 0h7M3 4h18v16H3V4Z"/>
          </svg>
          实时日志
        </a>
        <button id="open-options" class="options-link" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
            <path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm8 3a7.8 7.8 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a8.5 8.5 0 0 0-2-1.2L15.2 3h-4l-.4 2.6a8.5 8.5 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7.8 7.8 0 0 0 6.3 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a8.5 8.5 0 0 0 2 1.2l.4 2.6h4l.4-2.6a8.5 8.5 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/>
          </svg>
          设置
        </button>
      </div>
      <span>v1.4.0</span>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
