; PyYoutubeDL Supervisor program 定义（模板）
;
; __PROJECT_DIR__ 由 deploy/supervisor/install.sh 在渲染时替换为项目绝对路径。
; 不要直接把本文件拷进 /etc/supervisor/conf.d/，请使用 install.sh。
;
; program 名称必须与 supervisor-runner.sh 和 deploy/remote-deploy.sh 中的一致。

; ---------------------------------------------------------------------------
; 常驻服务：始终启动，崩溃即重启
; ---------------------------------------------------------------------------

[program:pyyoutubedl-app]
command=__PROJECT_DIR__/venv/bin/python __PROJECT_DIR__/app.py
directory=__PROJECT_DIR__
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
; app.py 会 fork ffmpeg 处理字幕，必须整组收敛
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__PROJECT_DIR__/logs/supervisor/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; ffmpeg 通过 PATH 查找（app.py 中直接以 "ffmpeg" 调用），必须显式给全 PATH；
; __PATH__ 由 install.sh 按本机实际存在的目录渲染（含 deno —— yt-dlp 会自动
; 探测 PATH 上的 JS runtime 解 nsig/PO token）。LANG 保证子进程输出按 UTF-8
; 解码（downloader.py 以 universal_newlines 逐行读取含中文标题的 yt-dlp 输出）。
environment=PATH="__PATH__",LANG="en_US.UTF-8",LANGUAGE="en_US:en",PYTHONUNBUFFERED="1"

[program:pyyoutubedl-downloader]
command=__PROJECT_DIR__/venv/bin/python __PROJECT_DIR__/downloader.py
directory=__PROJECT_DIR__
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
; 下载中被停时给 yt-dlp 子进程留收尾时间
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__PROJECT_DIR__/logs/supervisor/downloader.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__PATH__",LANG="en_US.UTF-8",LANGUAGE="en_US:en",PYTHONUNBUFFERED="1"

; ---------------------------------------------------------------------------
; 可选服务：由 service-guard.sh 读取 config.json 判定是否启动
;   退出码 10（未配置）/ 11（开关关闭）视为预期退出，状态停在 EXITED；
;   其余退出码视为崩溃，由 autorestart=unexpected 拉起。
; ---------------------------------------------------------------------------

[program:pyyoutubedl-ai-summary]
command=__PROJECT_DIR__/deploy/supervisor/service-guard.sh ai
directory=__PROJECT_DIR__
user=root
autostart=true
autorestart=unexpected
exitcodes=0,10,11
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__PROJECT_DIR__/logs/supervisor/ai-summary.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__PATH__",LANG="en_US.UTF-8",LANGUAGE="en_US:en",PYTHONUNBUFFERED="1"

[program:pyyoutubedl-webdav]
command=__PROJECT_DIR__/deploy/supervisor/service-guard.sh webdav
directory=__PROJECT_DIR__
user=root
autostart=true
autorestart=unexpected
exitcodes=0,10,11
startsecs=5
startretries=3
stopsignal=TERM
; 上传中被停时给 WebDAV 请求留收尾时间
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__PROJECT_DIR__/logs/supervisor/webdav.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__PATH__",LANG="en_US.UTF-8",LANGUAGE="en_US:en",PYTHONUNBUFFERED="1"

[program:pyyoutubedl-playlist-monitor]
command=__PROJECT_DIR__/deploy/supervisor/service-guard.sh playlist
directory=__PROJECT_DIR__
user=root
autostart=true
autorestart=unexpected
exitcodes=0,10,11
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__PROJECT_DIR__/logs/supervisor/playlist-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="__PATH__",LANG="en_US.UTF-8",LANGUAGE="en_US:en",PYTHONUNBUFFERED="1"
